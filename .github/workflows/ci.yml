name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      USE_MOCK_LLM: "true"
      USE_MOCK_EMAIL: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"

      # Non-blocking: the codebase currently has ~120 pre-existing ruff
      # findings (mostly datetime.utcnow() deprecation warnings), unrelated
      # to what CI is meant to gate. Surfaced for visibility, not a merge
      # blocker, until that's cleaned up as its own pass.
      - name: Lint (non-blocking)
        run: ruff check backend/
        continue-on-error: true

      - name: Run tests (unit + golden-set matching regression)
        run: python -m pytest backend/tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build
