# Mirrors vite.config.ts's dev-mode proxy (/api, /health -> backend) for
# the production build, which has no dev server to do this at request time.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
