[project]
name = "recruit-assistant"
version = "0.1.0"
description = "Local-first AI recruiting assistant: scans resumes from email and folders, matches against job descriptions with LLM scoring."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "structlog>=24.4",
    "pypdf>=5.1",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "keyring>=25.5",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.149",
    "msal>=1.31",
    "apscheduler>=3.10",
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
